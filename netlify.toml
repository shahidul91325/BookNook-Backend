# Netlify configuration for the BookNook Backend.
#
# Build: compiles TypeScript to dist/ (generates dist/server.js for persistent
# hosts and dist/api/index.js for serverless hosts).
#
# Functions: the Netlify Functions entry at netlify/functions/index.js wraps the
# shared Express app (src/app.ts) with serverless-http for the Lambda signature.
#
# Routes: /api/* is proxied to the Netlify Function.

[build]
  command = "npm run build"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/"
  to = "/.netlify/functions/index"
  status = 200

[[redirects]]
  from = "/favicon.ico"
  to = "/.netlify/functions/index"
  status = 200
