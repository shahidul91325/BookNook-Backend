services:
  - type: web
    name: booknook-server
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DB_NAME
        value: booknook
      - key: CORS_ORIGIN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: BETTER_AUTH_URL
        sync: false
    # Optional rate-limit overrides (defaults apply if omitted)
    # - key: RATE_LIMIT_WINDOW_MS
    #   value: 60000
    # - key: RATE_LIMIT_MAX
    #   value: 300
    # - key: RATE_LIMIT_WRITE_MAX
    #   value: 60
    # - key: TRUST_PROXY
    #   value: 0
